name: Publish Firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@6e7c96fd2dbf04dda9061c35bfdd9754adc57bbb # 2026.11.2
    with:
      files: |
        example.yaml
      release-summary: ${{ github.event.release.body }}
      release-url: ${{ github.event.release.html_url }}
      release-version: ${{ github.event.release.tag_name }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@6e7c96fd2dbf04dda9061c35bfdd9754adc57bbb # 2026.11.2
    needs:
      - build-firmware
    with:
      version: ${{ github.event.release.tag_name }}
