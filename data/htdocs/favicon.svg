<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#132B49"/>
      <stop offset="60%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#070E1B"/>
    </radialGradient>
    <linearGradient id="vanBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="levelBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="22%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#10E79D"/>
      <stop offset="78%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="levelGlow" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#10E79D" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10E79D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Opaque full-bleed background for iOS squircle icon mask -->
  <rect width="180" height="180" fill="#070E1B"/>
  <rect width="180" height="180" fill="url(#bgGlow)"/>

  <!-- Subtle outer spirit-ring reticle -->
  <circle cx="90" cy="90" r="68" fill="none" stroke="#1E293B" stroke-width="1.2" opacity="0.8"/>
  <circle cx="90" cy="90" r="60" fill="none" stroke="#2DD4BF" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.3"/>

  <!-- Soft glow beneath level horizon line -->
  <ellipse cx="90" cy="119" rx="64" ry="11" fill="url(#levelGlow)"/>

  <!-- 2015 RAM ProMaster 159" EXT High Roof (centered at x=90, scaled cleanly inside safe zone) -->
  <g transform="translate(24, 54) scale(0.52)">
    <!-- Body Shell -->
    <path d="M 9,92 L 7,63 L 10,24 Q 11,9 24,8 L 174,8 Q 188,8 197,18 L 204,29 L 227,48 Q 230,51 233,53 L 242,59 Q 245,62 245,70 L 244,88 L 236,93 L 227,93 A 17.5,17.5 0 0,0 193,93 L 74,93 A 17.5,17.5 0 0,0 40,93 L 13,93 Z"
          fill="url(#vanBody)" stroke="#F8FAFC" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Roof Cap Seam & Beltline -->
    <path d="M 12,26 L 176,26 Q 189,26 202,29" fill="none" stroke="#94A3B8" stroke-width="1.2" opacity="0.75"/>
    <path d="M 13,63 L 176,63 L 227,60" fill="none" stroke="#64748B" stroke-width="1.2" opacity="0.6"/>
    <!-- Side Stamped Panels -->
    <rect x="20" y="32" width="98" height="27" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1" opacity="0.7"/>
    <rect x="128" y="32" width="43" height="27" rx="3" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1" opacity="0.7"/>
    <!-- Cab Window -->
    <path d="M 180,35 L 197,35 L 223,53 L 219,61 L 194,61 L 180,57 Z" fill="#0F172A" stroke="#334155" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Windshield Edge & Mirror -->
    <path d="M 204,29 L 227,48 L 224,49.5 L 201,30.5 Z" fill="#0F172A"/>
    <rect x="202" y="47" width="8" height="12.5" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Headlight & Taillight -->
    <path d="M 227,54 L 240,59 L 242,65 L 228,64 Z" fill="#F8FAFC"/>
    <path d="M 7,61 L 12,61 L 11.5,81 L 7,81 Z" fill="#EF4444"/>
    <!-- Charcoal Bumpers & Rocker Skirt -->
    <path d="M 6,82 L 15,82 L 15,94 L 8,94 Q 6,94 6,90 Z" fill="#1E293B"/>
    <rect x="15" y="83" width="23" height="10" rx="1" fill="#1E293B"/>
    <rect x="76" y="83" width="115" height="10" rx="1" fill="#1E293B"/>
    <path d="M 227,73 L 244.5,72 L 245,87 Q 244.5,93 237,93.5 L 227,93.5 Z" fill="#1E293B"/>
    <!-- Rear Wheel -->
    <g transform="translate(57,96.2)">
      <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="8.4" fill="#CBD5E1"/>
      <circle cx="0" cy="0" r="4.2" fill="#334155"/>
    </g>
    <!-- Front Wheel -->
    <g transform="translate(210,96.2)">
      <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="8.4" fill="#CBD5E1"/>
      <circle cx="0" cy="0" r="4.2" fill="#334155"/>
    </g>
  </g>

  <!-- Glowing Level Horizon Bar + Spirit Bubble Center -->
  <rect x="24" y="112.5" width="132" height="3.5" rx="1.75" fill="url(#levelBar)"/>
  <!-- Spirit Level Bubble Caps / Tick Marks -->
  <rect x="73" y="119" width="34" height="9" rx="4.5" fill="#0F1929" stroke="#2DD4BF" stroke-width="1.2" opacity="0.95"/>
  <rect x="83" y="120.8" width="14" height="5.4" rx="2.7" fill="#10E79D"/>
  <line x1="81" y1="119" x2="81" y2="128" stroke="#070E1B" stroke-width="1.1"/>
  <line x1="99" y1="119" x2="99" y2="128" stroke="#070E1B" stroke-width="1.1"/>
</svg>
